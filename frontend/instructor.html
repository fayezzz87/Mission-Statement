<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instructor Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Instructor Dashboard</h1>

  <div class="card" id="setupCard">
    <div class="row">
      <div>
        <h2>Create a new assignment</h2>
        <label for="sName">Assignment name</label>
        <input type="text" id="sName" placeholder="e.g. Section 2 - Mission Statement">
        <label for="sAttempts">Max attempts</label>
        <input type="number" id="sAttempts" value="3" min="1" max="10">
        <button id="createBtn">Create assignment</button>
      </div>
      <div>
        <h2>Load an existing assignment</h2>
        <label for="loadCode">Assignment code</label>
        <input type="text" id="loadCode" placeholder="e.g. 7F3K2Q" maxlength="6">
        <button id="loadBtn" class="secondary">Load dashboard</button>
      </div>
    </div>
    <div id="err" class="error" style="display:none"></div>
  </div>

  <div id="dashboard" style="display:none"></div>
</div>
<script src="js/api.js"></script>
<script src="js/instructor.js"></script>
</body>
</html>
